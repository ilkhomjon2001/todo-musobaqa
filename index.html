<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musobaqa kuni — ToDo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13293F;
    --navy-2:#0e1f30;
    --teal:#1AA89B;
    --teal-light:#e6f4f2;
    --orange:#F5821F;
    --paper:#F6F5F1;
    --card:#ffffff;
    --ink:#1d2b39;
    --ink-soft:#5b6b7a;
    --line:#e3e8ec;
    --done:#8ba392;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 20px;}

  /* ---------- header ---------- */
  header{
    background:var(--navy);
    color:#fff;
    padding:38px 0 30px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(26,168,155,.35), transparent 70%);
  }
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--teal);
    font-weight:500;
    text-transform:uppercase;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    margin:10px 0 6px;
    line-height:1.1;
    letter-spacing:-.01em;
  }
  .lead{
    color:#a9bccb;
    font-size:14.5px;
    max-width:520px;
    line-height:1.5;
  }

  .progress-shell{
    margin-top:26px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    padding:16px 18px;
    position:relative;
    z-index:1;
  }
  .progress-top{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .progress-num{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    color:#fff;
  }
  .progress-num span{color:var(--teal); font-size:15px; font-weight:500; font-family:'Inter',sans-serif;}
  .progress-label{font-size:11.5px; color:#a9bccb;}
  .bar-track{
    height:8px; border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:5px;
    background:linear-gradient(90deg,var(--teal),#4fd3c4);
    width:0%;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- priority ---------- */
  .priority{
    margin:26px 0 8px;
    background:linear-gradient(135deg,#fff 0%,#fdf6ec 100%);
    border:1px solid #f0d9b8;
    border-left:4px solid var(--orange);
    border-radius:10px;
    padding:18px 20px;
  }
  .priority-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange);
    font-weight:500;
    margin-bottom:10px;
  }
  .priority-item{
    display:flex; gap:12px; align-items:flex-start;
    padding:8px 0;
    border-bottom:1px dashed #ecdcc0;
  }
  .priority-item:last-child{border-bottom:none;}
  .priority-num{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--orange);
    min-width:20px;
  }

  /* ---------- sections ---------- */
  .section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    margin-top:16px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(19,41,63,.03);
  }
  .section-head{
    display:flex; align-items:center; gap:14px;
    padding:16px 20px;
    cursor:pointer;
    user-select:none;
  }
  .section-head:hover{background:#fafbfb;}
  .sec-ring{
    position:relative;
    width:38px; height:38px;
    flex-shrink:0;
  }
  .sec-ring svg{transform:rotate(-90deg);}
  .sec-ring-bg{fill:none; stroke:var(--line); stroke-width:3.5;}
  .sec-ring-fg{fill:none; stroke:var(--teal); stroke-width:3.5; stroke-linecap:round;
    transition:stroke-dashoffset .4s ease;}
  .sec-ring-txt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--navy); font-weight:500;
  }
  .sec-meta{flex:1;}
  .sec-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .sec-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--navy);
    margin-top:2px;
  }
  .chevron{
    width:18px; height:18px; color:var(--ink-soft);
    transition:transform .3s ease;
    flex-shrink:0;
  }
  .section.open .chevron{transform:rotate(180deg);}

  .sec-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s cubic-bezier(.4,0,.2,1);
  }
  .section.open .sec-body{max-height:2000px;}
  .sec-list{padding:2px 14px 14px;}

  .item{
    display:flex; align-items:flex-start; gap:12px;
    padding:10px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .item:hover{background:var(--teal-light);}
  .box{
    width:19px; height:19px;
    border-radius:5px;
    border:1.6px solid #c3cdd6;
    flex-shrink:0;
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s ease;
    background:#fff;
  }
  .box svg{opacity:0; transform:scale(.5); transition:all .18s ease;}
  .item.checked .box{
    background:var(--teal); border-color:var(--teal);
  }
  .item.checked .box svg{opacity:1; transform:scale(1);}
  .item-text{
    font-size:13.5px; line-height:1.45; color:var(--ink); padding-top:1px;
  }
  .item.checked .item-text{
    color:var(--done);
    text-decoration:line-through;
    text-decoration-color:#b9c9c0;
  }

  /* footer */
  .foot{
    margin-top:30px;
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .sync-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--teal); margin-right:6px;
    animation:pulse 2s infinite;
  }
  .sync-dot.off{background:var(--orange); animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  @media(max-width:600px){
    h1{font-size:27px;}
    .progress-num{font-size:22px;}
    header{padding:30px 0 24px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="kicker">Robbit Akademiyasi &middot; Musobaqa kuni</div>
    <h1>Kun oldidan ToDo</h1>
    <div class="lead">Bitiruv marosimi bilan birga o'tkaziladigan robototexnika musobaqasi.
      Belgilangan bandlar hamma uchun joriy — kim qayerda ekaningizdan qat'i nazar bir xil ro'yxatni ko'rasiz.</div>
    <div class="progress-shell">
      <div class="progress-top">
        <div class="progress-num" id="progressNum">0<span> / 0 bajarildi</span></div>
        <div class="progress-label" id="progressPct">0%</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="priority">
    <div class="priority-title">Eng muhim uchtasi — shulardan boshlang</div>
    <div id="priorityList"></div>
  </div>

  <div id="sections"></div>

  <div class="foot"><span class="sync-dot" id="syncDot"></span><span id="syncText">yuklanmoqda…</span></div>
</div>

<script>
const DATA = [
  {
    id: "s1", eyebrow: "15 kun oldin", title: "Kechiktirib bo'lmaydigan narsalar",
    items: [
      "Nizomga 1.2-tahrir o'zgartirishlarini rasmiylashtirish va imzolash (bosh hakam + tashkiliy qo'mita raisi)",
      "O'zgartirishlarni barcha filiallarga va murabbiylarga rasman e'lon qilish — sana qayd etilsin",
      "E'londa aniq yozilsin: Lego Sumo endi faqat EV3 yoki SPIKE Prime — NXT/WeDo qatnashmaydi",
      "Shu e'londa NXT egalariga muqobil taklif qilinsin: Line Follower yoki RoboMission",
      "Musobaqa sanasini rasman e'lon qilish va ro'yxatga olishni ochish",
      "Bitiruvchilar ro'yxatini shakllantirish — kimlar bitiryapti, nechta kishi"
    ]
  },
  {
    id: "s2", eyebrow: "Ro'yxat", title: "Ro'yxat va kvota",
    items: [
      "Har yo'nalish bo'yicha ro'yxatni ochish, kvotani ko'rsatib qo'yish: RoboFutbol 32, Arduino Sumo 32, Lego Sumo 24, Line Follower 30, RoboRace 24, RoboMission 18, Loyihalar 18",
      "Kvota to'lgach zaxira ro'yxat ochish",
      "Bitta ishtirokchi bir nechta yo'nalishga yozilganda jadval to'qnashuvini oldindan tekshirish",
      "Tashqi (akademiya o'quvchisi bo'lmagan) arizalarni tashkiliy qo'mita orqali ko'rib chiqish"
    ]
  },
  {
    id: "s3", eyebrow: "7 kun oldin", title: "Tashkiliy tayyorgarlik",
    items: [
      "Har yo'nalish bo'yicha guruhlarni tuzish (Arduino 8×4, Lego 6×4, RoboFutbol 8×4) va e'lon qilish",
      "Guruh bosqichi va pley-off blankalarini chop etish (guruhga 1 ta, pley-offga 1 ta + zaxira)",
      "Texnik ko'rik cheklistlarini chop etish — har zonaga 2 nusxa",
      "Hakam va volontyorlarni 26 kishilik shtab jadvaliga biriktirish, telefon raqamlarini yig'ish",
      "Har bir rolga kim, qachon keladi aniqlash (ertalabki shtab 07:00 dan)",
      "Navbat koordinatorlarini tayinlash (3 kishi) — roli oldindan tushuntirilsin",
      "Bitiruv marosimi dasturini tayyorlash: nutq tartibi, video/taqdimot, diplom topshirish ketma-ketligi",
      "Marosim uchun zal formatini rejalashtirish (17:35–18:00 oralig'ida qayta tuzish kerak bo'ladigan tartib)"
    ]
  },
  {
    id: "s4", eyebrow: "Joy", title: "Jihoz va joy",
    items: [
      "Sumo zonasi: 3 ta dohyo tekshirish, sirt va oq halqa holatini nazorat qilish",
      "Zaxira dohyo tayyorlab qo'yish (asosiysi shikastlansa)",
      "RoboFutbol: 2 maydon, bortlar, darvozalar, kamida 4 ta bir xil to'p",
      "Pit zonasi: kamida 20 ta rozetka nuqtasi va 2 ta uzun uzaytirgich",
      "Line Follower va RoboRace treklarini yopishtirish, burchaklarni tekshirish",
      "RoboMission gilamchalari va topshiriq elementlarini tayyorlash",
      "Har zonaga jadval banneri yoki ekran buyurtma qilish",
      "O'lchov ramkalari (20×20, 25×25) va tarozilarni har zonaga taqsimlash",
      "Ota-onalar uchun tomosha chizig'ini belgilash (lenta yoki ajratuvchi)",
      "Tibbiy yordam nuqtasi va yong'in chiqish yo'llarini tayyorlash"
    ]
  },
  {
    id: "s5", eyebrow: "Nazorat", title: "Bosqichdan bosqichga qulash oldini olish",
    items: [
      "Pult chastotasi/kanali ro'yxatini tayyorlash — forma oldindan tayyor bo'lsin",
      "Har hakamga sekundomer va zaxira batareya",
      "Apellyatsiya arizasi blankalarini chop etish (~20 nusxa), bosh hakam stoliga qo'yish"
    ]
  },
  {
    id: "s6", eyebrow: "3 kun qoldi", title: "Bosqichma-bosqich",
    items: [
      "Tushlik ta'minotini tasdiqlash — to'lqinli tartib (13:00 va 13:20) haqida oshxona/kater bilan kelishish",
      "Diplom va sertifikatlarni chop etish, o'rin bo'yicha oldindan tayyorlab qo'yish (21 sovrindor + barcha ishtirokchi sertifikatlari)",
      "Bitiruvchilar uchun diplomlarni alohida tayyorlash (musobaqa sertifikatlaridan farqli hujjat)",
      "Maxsus nominatsiyalarni aniqlash (\"Eng yaxshi muhandislik yechimi\" va h.k.)",
      "Boshlovchi bilan butun kun stsenariysini birga o'tib chiqish — ayniqsa 15:45–19:00 oralig'idagi sahna blokini",
      "Media/fotosuratchi bilan qaysi lahzalar muhimligini kelishish (finallar + bitiruv marosimi)"
    ]
  },
  {
    id: "s7", eyebrow: "1 kun qoldi", title: "Kun oldidan",
    items: [
      "Barcha jihozni yig'ish va tekshirish yakunlangani haqida shtabdan tasdiq olish",
      "Ob-havo va zal harorat/ventilatsiya holatini tekshirish",
      "Har hakamga blanka, planshet, ruchka to'plamini tayyorlab qo'yish",
      "Bitiruv marosimi uchun kerakli jihoz (gullar, sovg'a, video ekran) tayyorligini tekshirish",
      "Barcha shtab a'zolariga ertalabki 07:00 chaqiruvni eslatish (SMS/qo'ng'iroq)"
    ]
  }
];

const PRIORITY_IDS = ["s1-0", "s2-0", "s1-5"]; // nizom e'lon, kvota, bitiruvchilar soni
const PRIORITY_LABELS = [
  "Nizom o'zgartirishlarini 15 kun oldin e'lon qilish (huquqiy asos)",
  "Kvota bo'yicha ro'yxatni yopish (jadval shunga qurilgan)",
  "Bitiruvchilar sonini aniqlash (marosim formatini shu belgilaydi)"
];

let state = {};
let allIds = [];
DATA.forEach(sec => sec.items.forEach((_, i) => allIds.push(sec.id + "-" + i)));

const STORAGE_KEY = "musobaqa-todo-state";

/* ---------- saqlash qatlami ----------
   window.storage (umumiy) mavjud bo'lsa — o'shandan foydalanamiz.
   Bo'lmasa localStorage'ga tushamiz, shunda hech bo'lmasa shu qurilmada
   belgilar saqlanib qoladi (ilgari xato bo'lganda state butunlay tozalanardi). */
const SHARED = !!(window.storage
  && typeof window.storage.get === "function"
  && typeof window.storage.set === "function");

const backend = SHARED ? {
  async get(){
    const res = await window.storage.get(STORAGE_KEY, true);
    return res && res.value ? res.value : null;
  },
  async set(raw){ await window.storage.set(STORAGE_KEY, raw, true); }
} : {
  async get(){ return localStorage.getItem(STORAGE_KEY); },
  async set(raw){ localStorage.setItem(STORAGE_KEY, raw); }
};

// Hali serverda tasdiqlanmagan lokal o'zgarishlar: id -> {value, at}
const pending = new Map();
const PENDING_TTL = 30000;

function setSync(ok, text){
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  if(dot) dot.classList.toggle("off", !ok);
  if(txt) txt.textContent = text;
}

function signature(obj){ return allIds.map(id => obj[id] ? "1" : "0").join(""); }

async function loadState(){
  let raw;
  try{
    raw = await backend.get();
  }catch(e){
    // MUHIM: xato bo'lganda state'ni tozalamaymiz — aks holda belgilar o'chib ketadi
    setSync(false, "saqlashda xato — belgilar faqat ekranda");
    return;
  }

  let remote = {};
  if(raw){
    try{ remote = JSON.parse(raw) || {}; }
    catch(e){ remote = {}; }
  }

  // Lokal, hali tasdiqlanmagan o'zgarishlarni remote ustiga qo'yamiz
  const now = Date.now();
  pending.forEach((rec, id) => {
    if(now - rec.at > PENDING_TTL){ pending.delete(id); return; }
    if(!!remote[id] === !!rec.value){ pending.delete(id); return; } // tasdiqlandi
    remote[id] = rec.value;
  });

  if(signature(remote) === signature(state)) return; // o'zgarish yo'q — qayta chizmaymiz
  state = remote;
  render();
}

let saving = false, saveQueued = false;
async function saveState(){
  if(saving){ saveQueued = true; return; }
  saving = true;
  try{
    await backend.set(JSON.stringify(state));
    setSync(true, SHARED ? "o'zgarishlar hammaga ko'rinadi" : "shu qurilmada saqlandi");
  }catch(e){
    console.error("storage error", e);
    setSync(false, "saqlanmadi — internetni tekshiring");
  }
  saving = false;
  if(saveQueued){ saveQueued = false; saveState(); }
}

function toggle(id){
  const value = !state[id];
  state[id] = value;
  pending.set(id, { value, at: Date.now() });
  render();
  saveState();
}

function checkIcon(){
  return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function render(){
  // progress
  const done = allIds.filter(id => state[id]).length;
  const total = allIds.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progressNum").innerHTML = done + "<span> / " + total + " bajarildi</span>";
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("barFill").style.width = pct + "%";

  // priority box
  const pWrap = document.getElementById("priorityList");
  pWrap.innerHTML = PRIORITY_IDS.map((id, i) => {
    const checked = !!state[id];
    return `<div class="priority-item">
      <div class="priority-num">${i+1}</div>
      <div class="item ${checked?'checked':''}" style="flex:1;padding:0;" data-id="${id}">
        <div class="box">${checkIcon()}</div>
        <div class="item-text">${PRIORITY_LABELS[i]}</div>
      </div>
    </div>`;
  }).join("");
  pWrap.querySelectorAll("[data-id]").forEach(el=>{
    el.addEventListener("click", ()=> toggle(el.getAttribute("data-id")));
  });

  // sections
  const wrap = document.getElementById("sections");
  const openState = {};
  wrap.querySelectorAll(".section").forEach(s => openState[s.dataset.sec] = s.classList.contains("open"));

  wrap.innerHTML = DATA.map((sec, si) => {
    const secIds = sec.items.map((_,i)=> sec.id+"-"+i);
    const secDone = secIds.filter(id=>state[id]).length;
    const secTotal = secIds.length;
    const secPct = secTotal ? secDone/secTotal : 0;
    const circumference = 2*Math.PI*15.5;
    const offset = circumference*(1-secPct);
    const isOpen = openState[sec.id] !== undefined ? openState[sec.id] : (secDone < secTotal);

    const itemsHtml = sec.items.map((text, i)=>{
      const id = sec.id+"-"+i;
      const checked = !!state[id];
      return `<div class="item ${checked?'checked':''}" data-id="${id}">
        <div class="box">${checkIcon()}</div>
        <div class="item-text">${text}</div>
      </div>`;
    }).join("");

    return `<div class="section ${isOpen?'open':''}" data-sec="${sec.id}">
      <div class="section-head" data-toggle="${sec.id}">
        <div class="sec-ring">
          <svg width="38" height="38" viewBox="0 0 38 38">
            <circle class="sec-ring-bg" cx="19" cy="19" r="15.5"/>
            <circle class="sec-ring-fg" cx="19" cy="19" r="15.5"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="sec-ring-txt">${secDone}/${secTotal}</div>
        </div>
        <div class="sec-meta">
          <div class="sec-eyebrow">${sec.eyebrow}</div>
          <div class="sec-title">${sec.title}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sec-body">
        <div class="sec-list">${itemsHtml}</div>
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".section-head").forEach(h=>{
    h.addEventListener("click", ()=>{
      h.closest(".section").classList.toggle("open");
    });
  });
  wrap.querySelectorAll(".item[data-id]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      toggle(el.getAttribute("data-id"));
    });
  });
}

render();
setSync(true, SHARED ? "o'zgarishlar hammaga ko'rinadi" : "shu qurilmada saqlanadi");
loadState();

if(SHARED){
  // boshqa foydalanuvchilarning o'zgarishlari uchun yengil polling
  setInterval(loadState, 4000);
}else{
  // localStorage rejimida: boshqa tab o'zgartirsa xabar keladi, polling kerak emas
  window.addEventListener("storage", e => { if(e.key === STORAGE_KEY) loadState(); });
}
</script>
</body>
</html>
